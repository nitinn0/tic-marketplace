services:
  postgres:
    image: postgres:16-alpine
    container_name: tic-marketplace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tic_marketplace_dev
      POSTGRES_USER: tic_user
      POSTGRES_PASSWORD: tic_password
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tic_user -d tic_marketplace_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
